server.port=${SERVER_PORT:8086}
spring.application.name=notification

spring.docker.compose.enabled=false

# Gateway Service URL
gateway.service.url=${GATEWAY_SERVICE:http://localhost:8080}

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=notification-service-group

notification.kafka.topic=auth_notifications

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Logging configuration
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN