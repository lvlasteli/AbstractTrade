server.port=${SERVER_PORT:8084}
spring.application.name=cart

spring.docker.compose.enabled=false

# Gateway Service URL
gateway.service.url=${GATEWAY_SERVICE:http://localhost:8080}

# Redis Cart Configuration
spring.data.redis.host=${REDIS_CART_HOST:localhost}
spring.data.redis.port=${REDIS_CART_PORT:6382}
spring.data.redis.password=${REDIS_CART_PASSWORD:cart_password_change_me}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Cart Configuration
cart.max-items-per-cart=100
cart.max-quantity-per-sku=999
cart.anon-ttl-seconds=259200
cart.user-ttl-days=90

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Logging configuration
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN
