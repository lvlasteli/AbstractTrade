server.port=${SERVER_PORT:8080}
spring.application.name=gateway

spring.docker.compose.enabled=false

# Redis for rate limiting
spring.data.redis.host=${REDIS_RATELIMIT_HOST:localhost}
spring.data.redis.port=${REDIS_RATELIMIT_PORT:6380}
spring.data.redis.password=${REDIS_RATELIMIT_PASSWORD:ratelimit_password_change_me}

# IP Rate Limiting
gateway.rate-limit.login.ip.max-attempts=10
gateway.rate-limit.login.ip.window-minutes=15
gateway.rate-limit.register.ip.max-attempts=5
gateway.rate-limit.register.ip.window-minutes=60
gateway.rate-limit.cart-creation.ip.max-attempts=3
gateway.rate-limit.cart-creation.ip.window-hours=1

# IP Blocking
gateway.ip-block.duration-minutes=60

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
gateway.kafka.topic=${GATEWAY_KAFKA_TOPIC:gateway_notifications}

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Logging configuration
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN

# Gateway Service Authentication
gateway.service.secret.header-name=X-Gateway-Request
gateway.service.secret.value=${GATEWAY_SERVICE_SECRET:gateway-secret-change-me}

# AuthService
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# ProductService
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}

# CartService
cart.service.url=${CART_SERVICE_URL:http://localhost:8084}

server.error.include-stacktrace=never
server.error.include-message=always