server.port=${SERVER_PORT:8080}
spring.application.name=gateway

spring.docker.compose.enabled=false

# Redis for rate limiting
spring.data.redis.host=${REDIS_RATELIMIT_HOST:redis-ratelimit}
spring.data.redis.port=${REDIS_RATELIMIT_PORT:6380}
spring.data.redis.password=${REDIS_RATELIMIT_PASSWORD:ratelimit_password}

# IP Rate Limiting
gateway.rate-limit.login.ip.max-attempts=10
gateway.rate-limit.login.ip.window-minutes=15
gateway.rate-limit.register.ip.max-attempts=5
gateway.rate-limit.register.ip.window-minutes=60

# IP Blocking
gateway.ip-block.duration-minutes=60

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
gateway.kafka.topic=${GATEWAY_KAFKA_TOPIC:auth_metrics}

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized