server.port=${SERVER_PORT:8081}
spring.application.name=auth

spring.docker.compose.enabled=false

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_AUTH_HOST:localhost}:${POSTGRES_AUTH_PORT:5432}/${POSTGRES_AUTH_DB:auth_db}
spring.datasource.username=${POSTGRES_AUTH_USER:auth_user}
spring.datasource.password=${POSTGRES_AUTH_PASSWORD:auth_password_change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Session Store
spring.data.redis.host=${REDIS_SESSION_HOST:localhost}
spring.data.redis.port=${REDIS_SESSION_PORT:6381}
spring.data.redis.password=${REDIS_SESSION_PASSWORD:session_password_change_me}
spring.data.redis.timeout=2000ms

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
auth.kafka.topic.notifications=auth_notifications
auth.kafka.topic.metrics=auth_metrics

# Cookie Settings
auth.cookie.name=auth_session_id
auth.cookie.max-age-seconds=86400
auth.cookie.secure=true
auth.cookie.same-site=Lax
auth.cookie.anon-cart.name=anon_cart_id
auth.cookie.anon-cart.max-age-seconds=259200
auth.cookie.anon-cart.secure=true
auth.cookie.anon-cart.same-site=Lax

# Security Settings
auth.session.ttl-hours=24
auth.password-reset.ttl-minutes=30

# Account Lockout
auth.lockout.max-attempts=5
auth.lockout.extended-max-attempts=10
auth.lockout.duration-minutes=15

auth.lockout.extended-duration-minutes=60
auth.lockout.max-duration-hours=24

# Rate Limiting
# Login rate limits
auth.rate-limit.login.user.max-attempts=5
auth.rate-limit.login.user.window-minutes=15
# Password reset rate limits
auth.rate-limit.password-reset.max-attempts=3
auth.rate-limit.password-reset.window-minutes=60

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized


# Logging configuration
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN

# Gateway Security
auth.security.gateway.enabled=true
auth.security.gateway.header-name=X-Gateway-Request
auth.security.gateway.header-value=${GATEWAY_SERVICE_SECRET:gateway-secret-change-me}
auth.security.gateway.allowed-ips=${GATEWAY_ALLOWED_IPS:gateway-service,127.0.0.1,localhost,172.18.0.0/16}
